name: vigia

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigia}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  vigia:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: vigia:${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://vigia:${POSTGRES_PASSWORD:-vigia}@postgres:5432/vigia?sslmode=disable
      GOMEMLIMIT: 96MiB
    ports:
      - "127.0.0.1:8080:8080"
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    stop_grace_period: 45s
    mem_limit: 128m
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
