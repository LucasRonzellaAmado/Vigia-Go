{{define "content"}}
<section class="auth-card card">
  <h1>Criar conta</h1>
  <p class="muted">Plano Free: até 10 monitores, checagem a cada 60s.</p>
  {{with .Data.Error}}<div class="alert alert-error">{{.}}</div>{{end}}
  <form method="post" action="/signup" class="form">
    <label>E-mail<input type="email" name="email" value="{{.Data.Email}}" required autofocus autocomplete="email"></label>
    <label>Senha<input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"><span class="hint">Mínimo de 8 caracteres.</span></label>
    <button class="btn btn-primary" type="submit">Criar conta</button>
  </form>
  <p class="muted small">Já tem conta? <a href="/login">Entrar</a></p>
</section>
{{end}}
